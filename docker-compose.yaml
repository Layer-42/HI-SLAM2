services:
  hislam2:
    build:
      context: .
      args:
        COLMAP_VERSION: ${COLMAP_VERSION:-3.8}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-75;80;86;89}
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    image: hislam2

    working_dir: /workspace/HI-SLAM2
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - video

    stdin_open: true
    tty: true

    shm_size: "16gb"
    mem_limit: 48g
    pids_limit: 4096

    environment:
      HOME: /home/hislam2
      DISPLAY: ${DISPLAY} # Display variable for X11 forwarding
      XAUTHORITY: /home/hislam2/.Xauthority
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      HF_HOME: /home/hislam2/.cache/huggingface
      TORCH_HOME: /home/hislam2/.cache/torch
      XDG_CACHE_HOME: /home/hislam2/.cache

    volumes:
      - .:/workspace/HI-SLAM2
      - ${SLAM_DATA_DIR:-./data}:/workspace/HI-SLAM2/data:rw
      - ${SLAM_PRETRAINED_DIR:-./pretrained_models}:/workspace/HI-SLAM2/pretrained_models
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-$HOME/.Xauthority}:/home/hislam2/.Xauthority:ro
      - hislam2_hf_cache:/home/hislam2/.cache/huggingface
      - hislam2_torch_cache:/home/hislam2/.cache/torch

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hislam2_hf_cache: # HF cache volume
  hislam2_torch_cache: # Torch cache volume
